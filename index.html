
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Assistant</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0b1020;
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app {
    width: 100%;
    max-width: 650px;
    height: 95vh;
    background: #151c30;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid #303b55;
}

header {
    padding: 20px;
    background: #1d2942;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #303b55;
}

.logo {
    width: 42px;
    height: 42px;
    background: #635bff;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 22px;
}

header h2 {
    font-size: 19px;
}

.status {
    color: #4ade80;
    font-size: 12px;
    margin-top: 4px;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    max-width: 85%;
    padding: 13px 16px;
    margin-bottom: 15px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.bot {
    background: #26344f;
    align-self: flex-start;
    border-bottom-left-radius: 3px;
}

.user {
    background: #635bff;
    margin-left: auto;
    border-bottom-right-radius: 3px;
}

.row {
    display: flex;
}

.input-area {
    padding: 15px;
    display: flex;
    gap: 9px;
    background: #1d2942;
}

input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border: 1px solid #43516e;
    outline: none;
    border-radius: 12px;
    background: #10182a;
    color: white;
    font-size: 15px;
}

button {
    border: none;
    background: #635bff;
    color: white;
    padding: 0 17px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 17px;
}

button:hover {
    background: #5148e5;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#mic {
    background: #26344f;
}

.typing {
    color: #aab5ce;
    font-size: 13px;
    margin-bottom: 12px;
}

</style>
</head>

<body>

<div class="app">

    <header>
        <div class="logo">🤖</div>
        <div>
            <h2>My AI Assistant</h2>
            <div class="status" id="status">● Ready to help</div>
        </div>
    </header>

    <div id="chat">
        <div class="row">
            <div class="message bot">
                Hello! 👋 Main aapka AI Assistant hoon.
                Aaj main aapki kya help kar sakta hoon?
            </div>
        </div>
    </div>

    <div class="input-area">
        <button id="mic" onclick="voiceInput()">🎤</button>

        <input
            type="text"
            id="userInput"
            placeholder="Ask me anything..."
            autocomplete="off"
        >

        <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>

</div>

<script>

// =====================================
// QLLM API CONFIGURATION
// =====================================

// Replace with your actual API key.
// WARNING: Do not publish your API key in frontend code.

const API_KEY = "YOUR_QOQ_API_KEY";

const API_URL =
    "https://api.qllm.quoqo.app/v1/chat/completions";

const MODEL = "qllm-sc-in-8b";

// =====================================

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const statusText = document.getElementById("status");
const sendBtn = document.getElementById("sendBtn");

// Keep conversation history for context
const messages = [
    {
        role: "system",
        content: "You are a helpful AI assistant. Reply in the language the user prefers."
    }
];

function addMessage(message, type) {

    const row = document.createElement("div");
    row.className = "row";

    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = message;

    row.appendChild(div);
    chat.appendChild(row);

    chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {

    const message = input.value.trim();

    if (!message) return;

    if (API_KEY === "YOUR_QOQ_API_KEY") {
        addMessage(
            "Please configure your QLLM API key first.",
            "bot"
        );
        return;
    }

    addMessage(message, "user");

    input.value = "";
    sendBtn.disabled = true;

    const typing = document.createElement("div");
    typing.className = "typing";
    typing.textContent = "AI is thinking...";
    chat.appendChild(typing);

    statusText.textContent = "● Thinking...";

    messages.push({
        role: "user",
        content: message
    });

    try {

        const response = await fetch(API_URL, {
            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + API_KEY
            },

            body: JSON.stringify({
                model: MODEL,
                messages: messages,
                rag: true
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error?.message ||
                data.message ||
                "API request failed: " + response.status
            );
        }

        const reply =
            data.choices?.[0]?.message?.content;

        if (!reply) {
            throw new Error("No response received from AI.");
        }

        messages.push({
            role: "assistant",
            content: reply
        });

        typing.remove();

        addMessage(reply, "bot");

        statusText.textContent = "● Ready to help";

    } catch (error) {

        typing.remove();

        addMessage(
            "Error: " + error.message +
            "\nPlease check your API key, model, and API connection.",
            "bot"
        );

        statusText.textContent = "● Connection error";

        // Remove failed user message from history
        messages.pop();

    } finally {

        sendBtn.disabled = false;
        input.focus();

    }
}

// Enter key support
input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

// =====================================
// VOICE INPUT
// =====================================

function voiceInput() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Voice input is not supported in this browser.");
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "hi-IN";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = function() {
        statusText.textContent = "● Listening...";
    };

    recognition.onresult = function(event) {

        input.value =
            event.results[0][0].transcript;

        sendMessage();

    };

    recognition.onerror = function() {
        statusText.textContent = "● Voice input error";
    };

    recognition.onend = function() {
        if (!sendBtn.disabled) {
            statusText.textContent = "● Ready to help";
        }
    };

    recognition.start();

}

</script>

</body>
</html>
