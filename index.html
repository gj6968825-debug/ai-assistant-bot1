
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Assistant</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0b1020;
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app {
    width: 100%;
    max-width: 650px;
    height: 95vh;
    background: #151c30;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid #303b55;
}

header {
    padding: 20px;
    background: #1d2942;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #303b55;
}

.logo {
    width: 42px;
    height: 42px;
    background: #635bff;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 22px;
}

header h2 {
    font-size: 19px;
}

.status {
    color: #4ade80;
    font-size: 12px;
    margin-top: 4px;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    max-width: 85%;
    padding: 13px 16px;
    margin-bottom: 15px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.bot {
    background: #26344f;
    align-self: flex-start;
    border-bottom-left-radius: 3px;
}

.user {
    background: #635bff;
    margin-left: auto;
    border-bottom-right-radius: 3px;
}

.row {
    display: flex;
}

.input-area {
    padding: 15px;
    display: flex;
    gap: 9px;
    background: #1d2942;
}

input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border: 1px solid #43516e;
    outline: none;
    border-radius: 12px;
    background: #10182a;
    color: white;
    font-size: 15px;
}

button {
    border: none;
    background: #635bff;
    color: white;
    padding: 0 17px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 17px;
}

button:hover {
    background: #5148e5;
}

#mic {
    background: #26344f;
}

.typing {
    color: #aab5ce;
    font-size: 13px;
    margin-bottom: 12px;
}

</style>
</head>

<body>

<div class="app">

    <header>
        <div class="logo">🤖</div>
        <div>
            <h2>My AI Assistant</h2>
            <div class="status">● Ready to help</div>
        </div>
    </header>

    <div id="chat">
        <div class="row">
            <div class="message bot">
                Hello! 👋 Main aapka AI Assistant hoon.
                Aaj main aapki kya help kar sakta hoon?
            </div>
        </div>
    </div>

    <div class="input-area">
        <button id="mic" onclick="voiceInput()">🎤</button>
        <input
            type="text"
            id="userInput"
            placeholder="Ask me anything..."
        >
        <button onclick="sendMessage()">➤</button>
    </div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");

function addMessage(message, type) {

    const row = document.createElement("div");
    row.className = "row";

    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = message;

    row.appendChild(div);
    chat.appendChild(row);

    chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {

    const message = input.value.trim();

    if (!message) return;

    addMessage(message, "user");

    input.value = "";

    const typing = document.createElement("div");
    typing.className = "typing";
    typing.textContent = "AI is thinking...";
    chat.appendChild(typing);

    try {

        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message
            })
        });

        if (!response.ok) {
            throw new Error("API connection failed");
        }

        const data = await response.json();

        typing.remove();

        addMessage(
            data.reply || "No response received.",
            "bot"
        );

    } catch (error) {

        typing.remove();

        addMessage(
            "AI server abhi connect nahi hai. AI API backend setup karna hoga.",
            "bot"
        );

    }
}

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

function voiceInput() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Voice input is not supported in this browser.");
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "hi-IN";
    recognition.start();

    recognition.onresult = function(event) {
        input.value = event.results[0][0].transcript;
        sendMessage();
    };

}

</script>

</body>
</html>
